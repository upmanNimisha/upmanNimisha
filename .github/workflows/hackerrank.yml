name: Update HackerRank

on:
  workflow_dispatch:

jobs:
  update-hackerrank:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Generate HackerRank SVG
        run: |
          python scripts/update_hackerrank.py

      - name: Check generated SVG
        run: |
          echo "Checking SVG..."
          ls -lh assets/hackerrank.svg
          head -20 assets/hackerrank.svg

      - name: Commit and push SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/hackerrank.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update HackerRank stats"
            git push
          fi
